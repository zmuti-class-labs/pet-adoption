<!DOCTYPE html>
<html>
<head>
    <title>Pet Adoption</title>
</head>

<body>
    <h1>Adopt a Pet</h1>

    <nav>
      <a href="index.html">Home</a> |
      <a href="adoption.html">Adoption</a> |
      <a href="gallery.html">Gallery</a> |
      <a href="contact.html">Contact Us</a>
    </nav>
    
    <h2>Available Pets</h2>
    <hr>

    <dl>
        <dt><b>Buddy</b></dt>
        <dd>A friendly golden retriever.</dd>

        <dt><b>Milo</b></dt>
        <dd>A playful kitten.</dd>

        <dt><b>Rocky</b></dt>
        <dd>An energetic German Shepherd.</dd>
    </dl>

    <h2>Adoption Form</h2>
    <form>

        <label>Full Name:</label><br>
        <input type="text" name="fullname"><br><br>

        <label>Email:</label><br>
        <input type="email" name="email"><br><br>

        <label>Age:</label><br>
        <input type="number" name="age"><br><br>

        <label>Select Pet:</label><br>

        <select>
            <option>Buddy</option>
            <option>Milo</option>
            <option>Rocky</option>
        </select>

        <br><br>

        <label>Why do you want to adopt?</label><br>
        <textarea rows="5" cols="30"></textarea>

        <br><br>

        <label>Preferred Pet Gender:</label><br>
        <input type="radio" name="gender"> Male
        <input type="radio" name="gender"> Female

        <br><br>

        <label>Services Needed:</label><br>
        <input type="checkbox"> Vaccination<br>
        <input type="checkbox"> Grooming<br>
        <input type="checkbox"> Training<br><br>

        <input type="submit" value="Submit Application">

    </form>

    <br>

    <footer>
        <p>Thank you for supporting pet adoption.</p>
    </footer>

</body>
</html>
